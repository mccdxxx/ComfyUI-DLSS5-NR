name: Release Windows ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure NVIDIA proprietary runtimes are not committed
        run: python tools/check_no_proprietary_binaries.py

      - name: Validate tag matches Python version
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          if (-not $ref.StartsWith('v')) { throw "Release tag must start with v" }
          $tag = $ref.Substring(1)
          $text = Get-Content nodes.py -Raw
          if ($text -notmatch '__version__\s*=\s*"([^\"]+)"') { throw 'Could not find __version__ in nodes.py' }
          if ($Matches[1] -ne $tag) { throw "Tag version $tag does not match nodes.py version $($Matches[1])" }

      - name: Build native bridge and caller helper
        shell: pwsh
        run: ./native/build_native.ps1

      - name: Package release
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $version = $ref.Substring(1)
          ./tools/package_release.ps1 -Version $version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-DLSS5-NR-${{ github.ref_name }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/*.zip dist/*.sha256 --generate-notes --title '${{ github.ref_name }}'
